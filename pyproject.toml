[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edward"
version = "0.1.0"
description = "Durable, evidence-backed personal research memory for exact search, semantic discovery, and writing workspaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nathan Morton" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "fastembed>=0.8.0",
    "pypdf>=6,<7",
    "mcp>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/nmorton13/edward"
Repository = "https://github.com/nmorton13/edward"
Issues = "https://github.com/nmorton13/edward/issues"

[project.optional-dependencies]
vector = [
    "sqlite-vec>=0.1.6",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
edward = "edward.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edward"]

[tool.hatch.build.targets.sdist]
include = [
    "src/edward",
    "tests",
    "schemas",
    "docs",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # Typer/FastAPI parameter defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
